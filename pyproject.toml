[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gridpulse"
version = "0.1.0"
description = "Real-time power grid anomaly detection with pandapower"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandapower>=2.14.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
ui = [
    "streamlit>=1.28.0",
    "plotly>=5.18.0",
]

[project.scripts]
gridpulse = "gridpulse.pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gridpulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["gridpulse"]
branch = true
omit = [
    "src/gridpulse/ui/app.py",  # Streamlit entry; covered by live verify
]

[tool.coverage.report]
fail_under = 75
show_missing = true
omit = [
    "src/gridpulse/ui/app.py",
]
