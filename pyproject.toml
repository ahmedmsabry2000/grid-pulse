# Root is documentation + scripts only. Each minirepo owns its own venv:
#   packages/gridpulse/  — core library
#   data-simulator/      — continuous events writer
#   streamlit-app/       — Streamlit UI
#   web-server/          — FastAPI REST + WS
#   web-client/          — React/Vite + deck.gl
#
# See AGENT.md for setup. Do not `uv sync` here for day-to-day runs.

[project]
name = "gridpulse-workspace"
version = "0.1.0"
description = "Grid Pulse monorepo workspace (minirepos own their venvs)"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false
