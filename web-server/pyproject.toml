[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gridpulse-web-server"
version = "0.1.0"
description = "FastAPI REST + WebSocket server for Grid Pulse"
requires-python = ">=3.11"
dependencies = [
    "gridpulse",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.uv.sources]
gridpulse = { path = "../packages/gridpulse", editable = true }

[project.scripts]
gridpulse-web = "gridpulse_server.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gridpulse_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
